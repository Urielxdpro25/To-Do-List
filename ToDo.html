<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>

<body>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #de5555;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            text-align: center;
            margin-top: 50px;
            color: #282174;
        }



        .contenedor {
            width: 400px;
            height: 400px;
            background-color: #fff;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;

        }

        .contBotones {
            background-color: #282174;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 50px;
            padding: 10px;
            margin-top: 20px;
        }

        .boton {
            color: #fff;
            background-color: #25224a;
            border-radius: 10px;
            border-style: groove;
            font-size: 16px;
            padding: 10px 20px;
        }

        .añadir {
            background-color: #07b01b;
        }

        .añadir:hover {
            background-color: #13721d;
        }

        .eliminar {
            background-color: #b00707;
        }

        .eliminar:hover {
            background-color: #9a0606;
        }
    </style>
    <h1 class="title">To-Do List</h1>

    <div class="contenedor">
        <input type="text" id="input" placeholder="Nueva tarea">
        <ul id="lista-tareas"></ul>
        <div class="contBotones">
            <button class="boton añadir" id="boton">Añadir Tarea</button>
            <button class="boton eliminar" id="boton">Eliminar Tarea</button>
        </div>
    </div>

    <script>

    </script>
</body>

</html>
