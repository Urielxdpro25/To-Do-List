<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>

<body>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #de5555;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            text-align: center;
            margin-top: 50px;
            color: #282174;
        }



        .contenedor {
            width: 400px;
            height: 400px;
            background-color: #fff;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .contBotones {
            background-color: #282174;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 50px;
            padding: 10px;
            margin-top: 20px;
        }

        .boton {
            color: #fff;
            background-color: #25224a;
            border-radius: 10px;
            border-style: groove;
            font-size: 16px;
            padding: 10px 20px;
        }

        .añadir {
            background-color: #07b01b;
        }

        .añadir:hover {
            background-color: #13721d;
        }

        .li {
            background-color: #07b01b;
            color: #fff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .borar {
            background-color: #ff0000;
        }

        .borar:hover {
            background-color: #a80000;
        }

        #lista-tareas {
            list-style-type: none;
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgb(5, 5, 5);
            font-size: 20px;
            background-color: #07b01b;
            border-radius: 10px;

        }
    </style>
    <h1 class="title">To-Do List</h1>

    <div class="contenedor">
        <input type="text" id="input" placeholder="Nueva tarea">
        <ol id="lista-tareas">
        </ol>

        <button class="boton añadir" id="boton">Añadir Tarea</button>
        <button class="boton borar" id="botonBorrar">Borrar Tarea</button>

    </div>

    <script>
        document.getElementById("boton").addEventListener("click", añadirTarea);
        const input = document.getElementById("input");
        const listaTareas = document.getElementById("lista-tareas");
        const checkbox = document.getElementById("checkbox");
        const botonBorrar = document.getElementById("botonBorrar");
        function añadirTarea() {
            const tarea = document.createElement("li");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            tarea.textContent = input.value;
            tarea.appendChild(checkbox);
            botonBorrar.addEventListener("click", function () {
                if (checkbox.checked) {
                    listaTareas.removeChild(tarea);
                }
            });

            listaTareas.appendChild(tarea);

            input.value = "";
        }
    </script>

</html>
